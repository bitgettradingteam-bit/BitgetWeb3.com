<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitget User Details</title>
  <link rel="stylesheet" href="Style.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>Please fill in your Bitget's<br>user details here</h1>
      <a href="#" class="help-link">need help?</a>
    </div>

    <form>
      <label class="red"><span class="required">*</span>UID:</label>
      <input type="text" placeholder="User Identity" required>

      <label class="red"><span class="required">*</span>Wallet:</label>
      <input type="text" placeholder="Deposit Address" required>

      <label class="red"><span class="required">*</span>Crypto:</label>
      <input type="text" placeholder="select crypto type" required>

      <p class="note">
        please ensure your UID, Wallet,<br>
        and memo are correct before submission.
      </p>

      <p class="warning">
        Are you certain you've provided the<br>
        correct details?
      </p>

      <div class="attest">
        <span>Yes I attest =></span>
        <input type="checkbox" required>
      </div>

      <button type="submit" class="btn-submit">Submit</button>
    </form>
  </div>
</body>
</html>
