<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>How to Find User ID on Bitget</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px 12px 35px;
            background: #ffffff;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            background-color :black ;
        }

        .container {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
        }

        /* Main heading */
        h1 {
            font-size: 21px;
            font-weight: 700;
            margin: 0 0 22px;
            line-height: 1.2;
        }

        /* Instructions */
        .instructions {
            font-size: 12px;
            line-height: 1.45;
        }

        .instructions p {
            margin: 0 0 15px;
        }

        /* Black step boxes */
        .step {
            display: inline-block;
            background: #000000;
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 5px;
        }

        /* Illustration */
        .illustration {
            margin-top: 22px;
            text-align: center;
        }

        .illustration img {
            display: block;
            width: 100%;
            max-width: 820px;
            height: auto;
            margin: 0 auto;
            border-radius: 7px;
        }

        /* Smaller phones */
        @media (max-width: 400px) {

            body {
                padding: 18px 10px 30px;
            }

            h1 {
                font-size: 19px;
                margin-bottom: 19px;
            }

            .instructions {
                font-size: 11px;
                line-height: 1.4;
            }

            .instructions p {
                margin-bottom: 13px;
            }

            .step {
                font-size: 11px;
                padding: 3px 7px;
                border-radius: 4px;
                margin-bottom: 4px;
            }

            .illustration {
                margin-top: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>How to Find User ID on Bitget</h1>

        <div class="instructions">

            <div class="step">Step 1</div>
            <p>
                Open Bitget and tap the
                <strong>profile icon</strong> at the top-left.
            </p>


            <div class="step">Step 2</div>
            <p>
                Tap the <strong>arrow beside your profile</strong>
                to open the User Center.
            </p>


            <div class="step">Step 3</div>
            <p>
                Find your <strong>UID</strong> and tap the number
                to copy it.
            </p>

        </div>


        <!-- Illustration -->
        <div class="illustration">
            <img
                src="find uid.jpeg"
                alt="How to find Bitget User ID"
            >
        </div>

    </div>

</body>
</html>
