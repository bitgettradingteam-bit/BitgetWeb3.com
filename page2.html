<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitget Registration</title>
  <link rel="stylesheet" href="Style.css">
</head>
<body>
  <div class="card">
    <div class="info-box">
      <p>how we protect your asset:</p>
      <a href="#">Asset protection</a>
      <p>how we generate profit:</p>
      <a href="#">profit making</a>
      <p>legal compliance:</p>
      <a href="#">regulation</a>
      <h2>Please fill in the form below<br>to proceed</h2>
    </div>

    <form>
      <label for="name">Name:</label>
      <input type="text" id="name" placeholder="Name" required>

      <label for="phone">Phone:</label>
      <input type="tel" id="phone" placeholder="Phone" required>

      <label for="email">Email:</label>
      <input type="email" id="email" placeholder="Email" required>

      <label for="country">Country:</label>
      <input type="text" id="country" placeholder="Country" required>

      <button type="submit" class="btn-submit">Submit</button>

      <div class="btn-row">
        <button type="button" class="btn-next" onclick="window.location.href='third.html'">Next</button>
      </div>
    </form>
  </div>
</body>
</html>
